<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarYetu - Car Rental Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- BoxIcons Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <!-- nav bar -->
        <div class="nav">
            <!-- menu icons -->
            <div class="menu-icon">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <!-- logo -->
            <a href="#" class="logo">CarYetu<span>Rental</span></a>
             <!-- nav links -->
            <div class="nav-links">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Rentals</a>
                <a href="#" class="nav-link">Team</a>
                <a href="#" class="nav-link">Faqs</a>
                <a href="#" class="nav-link">Blogs</a>
                <a href="#" class="nav-link">Contact</a>
            </div>

            <div class="right-nav">
                <i class="bx bx-search search-icon"></i>
                <!-- search input field -->
                 <div class="search-box container">
                    <input type="search" name="" id="" placeholder="Search here...">
                 </div>
                 <!-- login and signup -->
                  <div class="login-btn">
                    <span>Login</span>
                  </div>

                  <div class="sign-up-btn">
                    <span>Sign Up</span>
                  </div>
            </div>
        </div>
    </header>
     <!-- home section -->
    <section class="home" id="home">
        <div class="home-container container">
            <!-- form -->
                <form action="" class="home-form">
                    <h2>Find your perfect <span>rental car today</span></h2>
                    <select name="" id="cars">
                        <option value="cars">Select Car Type</option>
                        <option value="cars">Sedan</option>
                        <option value="cars">SUV</option>
                        <option value="cars">Sports</option>
                    </select>
                    <input type="date" name="" id="" placeholder="Pick-up date">
                    <input type="date" name="" id="" placeholder="Return date">
                    <input type="text" name="" id="" placeholder="Location">
                    <input type="submit" value="Search" class="home-form-btn">
                </form>
              <!-- cover -->
            <img src="images/home-img.png" alt="image of a car" class="home-img">
        </div>
    </section>
     <script src="js/main.js"></script> 
</body>
</html>
